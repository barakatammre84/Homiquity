<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- SEO:START — per-route <title>/description/OG/Twitter. These static values are the
         homepage defaults and the fallback the CDN serves to humans; server/seo (roadmap
         Phase 2) replaces this whole block per URL for crawlers & social scrapers. -->
    <meta name="description" content="Clarity for every stage of homeownership. Get pre-approved in minutes with a clear, calm mortgage experience. No jargon, no stress." />
    <meta property="og:title" content="Homiquity - Clarity for Every Stage of Homeownership" />
    <meta property="og:description" content="Get pre-approved in minutes. Clear, calm, and achievable homeownership starts here." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homiquity" />
    <meta property="og:url" content="https://homiquity.com/" />
    <meta property="og:image" content="https://homiquity.com/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Homiquity - Clarity for Every Stage of Homeownership" />
    <meta name="twitter:description" content="Get pre-approved in minutes. Clear, calm, and achievable homeownership starts here." />
    <meta name="twitter:image" content="https://homiquity.com/og-default.png" />
    <title>Homiquity - Clarity for Every Stage of Homeownership</title>
    <!-- SEO:END -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only the families referenced by the --font-* CSS variables in
         index.css (Geist / Source Serif 4 primaries; Inter / JetBrains Mono
         fallbacks). The previous list requested 25 families — 20 unused
         leftovers from a theme scaffold — on every page load. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@300..700&family=Source+Serif+4:opsz,wght@8..60,300..800&display=swap" rel="stylesheet">
    <!-- Global structured data (schema.org). Organization + WebSite live here so
         non-JS crawlers see the entity on every route; per-page schema (Article,
         FAQPage, DefinedTermSet, BreadcrumbList) is injected client-side by SEOHead.
         F1: add "identifier" (NMLS #) to the Organization once licensing lands —
         never emit a placeholder identifier while it is PENDING. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "FinancialService"],
          "@id": "https://homiquity.com/#organization",
          "name": "Homiquity",
          "legalName": "Homiquity Mortgage Corporation",
          "url": "https://homiquity.com/",
          "logo": "https://homiquity.com/og-default.png",
          "image": "https://homiquity.com/og-default.png",
          "slogan": "Clarity for every stage of homeownership.",
          "description": "Homiquity is a mortgage brokerage focused on a clear, calm homebuying experience — guidance and support at every stage of homeownership.",
          "areaServed": "US"
        },
        {
          "@type": "WebSite",
          "@id": "https://homiquity.com/#website",
          "url": "https://homiquity.com/",
          "name": "Homiquity",
          "inLanguage": "en-US",
          "publisher": { "@id": "https://homiquity.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://homiquity.com/learn?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
