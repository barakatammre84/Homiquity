# Dependabot — weekly dependency-update PRs. Part of the vulnerability-management
# program in knowledge-base/governance/security/INFORMATION_SECURITY_POLICY.md §8
# (the blocking per-PR scan is the `pnpm audit` step in ci.yml's gate job).
version: 2
updates:
  - package-ecosystem: "npm" # covers pnpm via pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript 7 is the native Go port. Vercel's Node builder loads the
      # project's own compiler through the legacy CommonJS API (ts.sys.readFile),
      # which the port does not expose, so every deploy fails with
      # "Cannot read properties of undefined (reading 'readFile')" — while `tsc`
      # itself passes, so the gate stays green and prod silently freezes on the
      # last good deployment. That is #268 → #279; do not re-take the bump until
      # Vercel's builder supports the native port, then remove this entry.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # drizzle-zod 0.8 imports from `zod/v4` and therefore emits Zod 4 schema
      # types, while this codebase's routes validate with the Zod 3 classic API
      # (ZodTypeAny). The two type systems do not unify: taking 0.8.3 in #282
      # produced 214 typecheck errors across the route layer. `zod` itself is
      # unchanged at ^3.25.76 — this is drizzle-zod switching surface, not a zod
      # bump, which is why a 0.x MINOR is breaking here and the group would keep
      # re-proposing it. Adopting it is a Zod v3 -> v4 migration; do that in its
      # own PR, then remove this entry.
      - dependency-name: "drizzle-zod"
        versions: [">=0.8.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
