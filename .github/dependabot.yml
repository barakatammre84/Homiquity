# Dependabot — weekly dependency-update PRs. Part of the vulnerability-management
# program in knowledge-base/governance/security/INFORMATION_SECURITY_POLICY.md §8
# (the blocking per-PR scan is the `pnpm audit` step in ci.yml's gate job).
version: 2
updates:
  - package-ecosystem: "npm" # covers pnpm via pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript 7 is the native Go port. Vercel's Node builder loads the
      # project's own compiler through the legacy CommonJS API (ts.sys.readFile),
      # which the port does not expose, so every deploy fails with
      # "Cannot read properties of undefined (reading 'readFile')" — while `tsc`
      # itself passes, so the gate stays green and prod silently freezes on the
      # last good deployment. That is #268 → #279; do not re-take the bump until
      # Vercel's builder supports the native port, then remove this entry.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # drizzle-zod 0.8 emits against zod's v4 type surface. The peer range
      # LOOKS satisfied — 0.8.3 declares `zod: ^3.25.0 || ^4.0.0` and resolves
      # against our zod@3.25.76 — but 3.25 ships BOTH surfaces, and the v4
      # types do not structurally match the v3-style ZodTypeAny our route
      # handlers pass to. Result: 214 typecheck errors, 181 of them
      # "missing _type, _parse, _getType, _getOrReturnCtx from ZodType".
      # Measured 2026-08-02: reverting drizzle-zod alone, with the other 30
      # bumps in place, takes 214 -> 0. One dependency was poisoning the whole
      # group, which is why the same PR kept coming back blocked:
      # #264 -> #269 -> #274 -> #282.
      # This is a migration (move the affected schemas to zod v4 style, or
      # migrate zod itself), not a bump. Remove this entry when that is done —
      # zod 4 is proposed in #290; when THAT lands, drop this whole block rather
      # than loosening the bound.
      #
      # `versions`, not `update-types`: the boundary that matters is the surface
      # switch at 0.8, not a semver category. An `update-types: [semver-minor]`
      # rule (what #284 first shipped) catches 0.7.1 -> 0.8.3, but a later
      # 0.7.x -> 1.0.0 classifies as semver-MAJOR and would sail straight
      # through, re-poisoning the group with a bigger break than the one being
      # guarded against. Pinning >=0.8.0 blocks every version that carries the
      # zod/v4 surface, whatever semver calls it. (Constraint from #285, which
      # reached the same diagnosis independently.)
      - dependency-name: "drizzle-zod"
        versions: [">=0.8.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
