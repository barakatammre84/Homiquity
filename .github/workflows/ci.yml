name: CI

# Two roles:
#   gate         — on every PR to main: typecheck + unit tests (node + client component
#                  suites) + prod-dependency audit (high/critical) + schema↔migration
#                  drift guard + design-token ratchet. This is the required check for
#                  the auto-merge-green policy; a schema change without a migration or
#                  a raw palette class over baseline goes RED and cannot merge.
#   migrate-prod — on merge to main: apply any pending migrations to PROD so the
#                  database is never left behind the code (the 2026-07-13 outage cause).
#                  Also runnable manually (workflow_dispatch) — defaults to a DRY RUN,
#                  which is the runbook's mandatory pre-flight. Scope note: the dry run
#                  reconciles the JOURNAL (what does prod think is pending?) and never
#                  executes a migration's SQL, so it cannot pre-flight a CONTRACT step
#                  (SET NOT NULL / CHECK / FK) that could fail on data — those need the
#                  read-only prod probe in knowledge-base/runbooks/DB_MIGRATIONS.md
#                  (§Contract migrations) BEFORE the migration is authored.
#
# Credentials: NO prod DB password is stored in GitHub. migrate-prod mints a fresh
# Neon DIRECT (unpooled) connection string at run time from NEON_API_KEY (provisioned
# by the Neon↔GitHub integration) via scripts/neon-connection-uri.cjs. A rotated
# Neon password therefore never breaks CI, and there is no second copy of the
# credential to leak.
#
# Prereqs (one-time, done in GitHub, not by Claude):
#   • Repo secret NEON_API_KEY — added automatically by the Neon↔GitHub integration.
#   • Repo variable NEON_PROJECT_ID — ONLY if the key can see more than one Neon
#     project (the script fails with the list of ids when it's ambiguous).
#   • Branch protection on `main` requiring the "gate" check (makes the gate binding).
#     ✅ CONFIGURED 2026-07-17: gate required · enforce_admins ON (it binds the repo
#     owner too — auto-merge runs AS the admin, so without this the rule would be
#     decorative) · no required reviews (autonomous merge of a GREEN PR still works)
#     · force-push and deletion of `main` blocked. See the rename warning on the job.

on:
  pull_request:
    # NO `branches:` FILTER, deliberately — every PR is gated, whatever its base.
    #
    # This carried `branches: [main]` until 2026-08-13. The effect was that a PR
    # based on another feature branch matched nothing and got ZERO check-runs for
    # its entire life, then ran for the first time only when someone retargeted it
    # to main — which is the moment they are about to merge it, i.e. the latest
    # possible moment and the one where a red result is most expensive.
    #
    # Worse, a zero-check PR does not LOOK unchecked. `gh pr view` reports
    # `mergeStateStatus: CLEAN`, which means "no merge conflicts" and says nothing
    # about CI; on a stacked PR the two are indistinguishable at a glance. Observed
    # on #517 and #518 (2026-08-13), both reported CLEAN with no run ever scheduled.
    # PR #425 (2026-08-06) was the same shape with auto-merge armed — nothing was
    # stopping it.
    #
    # Only the `gate` job can fire here: `migrate-prod` is `push ||
    # workflow_dispatch` and `verify-deploy` is `push`, so neither can be reached by
    # a pull_request event no matter what its base is. And the §9 guard diffs
    # `github.event.pull_request.base.sha` — the PR's REAL base — so a stacked PR is
    # checked against its parent branch and sees only its own changes.
    #
    # `types` is explicit because the DEFAULT set (opened, synchronize, reopened)
    # silently skips two events this repo relies on:
    #
    #   edited      — fires on a base-branch retarget, which is now a re-gate
    #                 against the NEW base rather than the first gate ever. It also
    #                 fires on title/body edits, which is load-bearing:
    #                 `guard:security` reads the PR BODY from the event payload
    #                 (`github.event.pull_request.body`), so re-running an old run
    #                 replays the OLD body and can never see a security review added
    #                 after the fact. Observed on PR #424.
    #
    #   ready_for_review — a draft PR marked ready otherwise keeps whatever
    #                 (possibly no) checks it had as a draft.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — list pending migrations without applying them"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    # ⚠️ DO NOT RENAME without updating branch protection in the same change. This
    # `name:` string IS the required status check on `main`, matched VERBATIM (the
    # separators are U+00B7 MIDDLE DOTs, not periods). Rename it and every future PR
    # deadlocks: the new check never satisfies the old required context, so the PR sits
    # "Expected — Waiting for status" forever, and enforce_admins=true means nobody can
    # bypass it. Rename procedure (both, together):
    #   gh api -X PATCH repos/OWNER/REPO/branches/main/protection/required_status_checks \
    #     -f 'contexts[]=<the exact new name>'
    # Recovery if it does deadlock: re-point the rule with the PATCH above, or turn
    # enforce_admins off temporarily (Settings → Branches). Both need repo admin.
    name: gate (typecheck · tests · schema guard)
    if: github.event_name == 'pull_request'
    # One in-flight gate per PR — a new push supersedes the old run instead of
    # racing it. Without this, every push to a branch started a fresh ~5-minute
    # run while the superseded one ran to completion for a commit nobody would
    # ever merge. The repo is PRIVATE, so those minutes are metered (KTLO-2):
    # measured 2026-08-17, 66 CI runs over 4.85 days (~13.6/day) at ~4-5 min
    # each is ~1,850 min/month against a 2,000-minute free allowance.
    #
    # SAFE BECAUSE OF THE `if:` ONE LINE ABOVE, not because of this group's key.
    # `gate` runs on pull_request ONLY, so cancel-in-progress structurally cannot
    # reach `migrate-prod` (push || workflow_dispatch) or `verify-deploy` (push)
    # — a cancelled deploy or a half-applied migration is the 2026-07-13 outage
    # class and is not reachable from here. tests/ciTriggers.test.ts pins both
    # that `if:` and this block together; if the `if:` is ever widened, THIS
    # becomes dangerous and that test is what says so.
    #
    # Cancelling is never a lost signal: a cancel only happens because a NEWER
    # run for the same PR started, and branch protection evaluates the latest
    # run for the head SHA. On an `edited` event that supersedes an in-flight
    # `synchronize`, the surviving run is the one carrying the NEWER PR body —
    # which is what guard:security needs to read.
    concurrency:
      group: gate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    services:
      # Disposable Postgres for the self-host boot probe (Railway migration
      # path): the probe applies the journal and boots dist/index.js against a
      # real database. Unit tests do NOT use this — they keep their hermetic
      # placeholder DATABASE_URL from vitest.config.ts.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: selfhost_boot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the §9 guard can diff base..head. The default shallow
          # checkout has neither sha, and a guard that cannot see the diff would
          # silently pass every PR.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Dependency vulnerabilities (prod deps, high+)
        # Blocking scan — vulnerability-management program in
        # knowledge-base/governance/security/INFORMATION_SECURITY_POLICY.md §8.
        # High/critical only; moderates stay visible via `pnpm checkup`. (The job
        # `name:` above deliberately does not mention this step — it is the verbatim
        # required-check string; see the rename warning.)
        run: pnpm audit --prod --audit-level=high
      - name: Schema ↔ migration drift guard
        run: pnpm guard:schema
      - name: Migration ledger integrity
        # prod applies migrations/ automatically on merge, in journal `idx` order, so
        # a duplicate/missing/misnumbered entry is a production-DDL problem that only
        # surfaces after the merge button. Fails on duplicate idx or tag, a gap in the
        # 0..N-1 run, an entry with no .sql, an un-journalled .sql, and a filename
        # whose number disagrees with its idx. The case this exists for is the
        # 2026-08-04 double-`0038` near-miss (TEAM_PRACTICES §4), which was caught by
        # hand. (Job `name:` above deliberately unchanged — it is the verbatim
        # required-check string; see the rename warning.)
        run: pnpm guard:migrations
      - name: Delivery-stack freeze (F-14 channel decision)
        # A broker never delivers to Fannie Mae — the wholesale lender is the
        # seller/servicer. While shared/businessChannel.ts says "broker", the GSE
        # delivery stack may shrink but not grow, so the channel decision is not
        # made by accretion while it sits open. Turns itself off if the channel
        # flips to correspondent. (Job `name:` above deliberately unchanged — it is
        # the verbatim required-check string; see the rename warning.)
        run: pnpm guard:channel

      - name: Design-token ratchet
        # Raw-palette / bare-white-black counts vs scripts/design-token-baseline.json
        # (ratchet: counts may only go down). Gated 2026-07-19 — adjudication log §4
        # option 3, after the component-test lane stabilized baselines at 0/97. The
        # residual is the strict:false racing-merge window (TEAM_PRACTICES §5 traps):
        # two racing PRs can still combine into a red main, which the NEXT PR's gate
        # then surfaces — fix forward by retokening or ratcheting the baseline in that
        # PR. (Job `name:` above deliberately unchanged — verbatim required-check
        # string; see the rename warning.)
        run: pnpm guard:tokens
      - name: UI-standard ratchet
        # The other half of DESIGN_SYSTEM.md: seven counts (PageShell drift, icon-registry
        # drift, nested interactive controls, raw hex, arbitrary colour values, palette
        # classes the token guard's regex cannot see, un-prefixed multi-column grids) vs
        # scripts/ui-standard-baseline.json. Same ratchet contract as the token guard —
        # counts may only go down. Added 2026-08-18 because the standard had been measuring
        # itself in prose since 2026-07-14 and the prose rotted: the doc claimed 57% of pages
        # opted out of PageShell while the real figure had reached 82%. A number in a
        # baseline file cannot go stale silently. It is a TEXT SCAN — it sees none of layout,
        # contrast or rendering; green means "no new instances of seven specific mistakes".
        # (Job `name:` above deliberately unchanged — verbatim required-check string.)
        run: pnpm guard:ui
      - name: Knowledge-base index guard
        # "An unindexed doc is an unread doc" (TEAM_PRACTICES). Fails on a
        # knowledge-base/*.md missing from the index, or an index link pointing at a
        # path that does not exist. Deterministic — it reads only repo contents, which
        # is why it belongs in the required gate while its sibling doc-freshness guard
        # does NOT: that one goes overdue on a calendar date and would block every
        # merge in the repo for a reason no PR caused. See doc-freshness.yml.
        # (Job `name:` above deliberately unchanged — verbatim required-check string;
        # see the rename warning.)
        run: pnpm guard:kb
      - name: Routine registry guard
        # The suite that governs the machine writing everything else was the one
        # layer checked by prose alone — CHARTER §0 is what that costs. This fails
        # on a routine SKILL.md nobody registered (a fossil), a registered routine
        # whose definition is invisible with no dated waiver, a CHARTER §3 clock
        # that disagrees with knowledge-base/routines/registry.json, a report that
        # belongs to no routine, or a fleet-2 trigger promising to invoke a skill
        # that does not exist. Structural only: waiver EXPIRY is deliberately left
        # to `--strict` (checkup + the weekly doc-freshness workflow) for the same
        # reason doc-freshness itself is not here — a calendar failure inside the
        # required check blocks every merge on a day no diff caused.
        # (Job `name:` above deliberately unchanged — verbatim required-check string;
        # see the rename warning.)
        run: pnpm guard:routines
      - name: Doc staleness ratchet
        # Dead vocabulary in LIVING docs vs scripts/doc-staleness-baseline.json
        # (ratchet: counts may only go down). Metrics: kb/ paths, npm-as-instruction,
        # launch-sprint references, the old repo name, the dead Vercel host. Immutable
        # history (archive/, logs/, routines/reports/, CHANGE_LEDGER, the teardown raw
        # notes) is excluded — a dated record carrying an old name is correct history,
        # not rot. Born from the 2026-08-18 knowledge-file audit: TEAM_PRACTICES held
        # dead pointers while its freshness line was green, because the freshness guard
        # attests verification recency and nothing attested vocabulary. Deterministic
        # (repo contents only), so it belongs in the gate per the KB-index guard's rule
        # above. Run with --list for exact lines. (Job `name:` above deliberately
        # unchanged — verbatim required-check string; see the rename warning.)
        run: pnpm guard:staleness
      - name: Security-review guard (TEAM_PRACTICES §9)
        # Fails when the PR touches a §9 trigger (PII vault/encryption, auth/sessions,
        # role gates, uploads, outbound messaging, PII-adjacent logging) and the PR body
        # records no security review. §9 is binding but was unenforceable: CODEOWNERS +
        # required code-owner review is the usual mechanism, and it cannot work with a
        # single collaborator — GitHub forbids self-approval and enforce_admins is on, so
        # it would deadlock every §9 PR. This enforces the ARTIFACT instead of a second
        # approver. It proves a review was written down, never that it was correct, and it
        # cannot see two §9 triggers at all (a PII column in shared/schema/, a new PII
        # sub-processor) — those stay human judgement. (Job `name:` above deliberately
        # unchanged — verbatim required-check string; see the rename warning.)
        env:
          # Via env, never inlined into run: — a PR body is attacker-controlled text and
          # ${{ }} interpolation into a shell script is a command-injection vector.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # pipefail so a git failure reds the gate instead of yielding an empty diff that
        # the guard would read as "no triggers touched" and pass.
        shell: bash
        run: |
          set -euo pipefail
          # Via FILES, not env vars. `git diff -U0` on a large PR exceeds Linux's
          # MAX_ARG_STRLEN (131,072 bytes — the per-STRING environment cap, not the
          # total-size one). Past it, execve fails with E2BIG and this step dies as
          # `pnpm: Argument list too long` before the guard runs at all — a
          # misleading infra failure reported AFTER every real check in the gate has
          # passed. First hit at 137,761 bytes on a documentation-heavy PR; the
          # guard reads *_FILE in preference to the inline vars.
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed_files.txt"
          git diff -U0 "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed_lines.diff"
          CHANGED_FILES_FILE="$RUNNER_TEMP/changed_files.txt" \
          CHANGED_LINES_FILE="$RUNNER_TEMP/changed_lines.diff" \
            pnpm guard:security
      - name: Query-key convergence guard
        # TWO checks, both behind this one script. `invalidateQueries` is the only
        # write→read feedback mechanism in the client, so a key that matches
        # nothing is a mutation that silently refreshes nothing.
        #
        # 1. query-key-guard.cjs (SHAPE) — fails on an interpolated template-string
        #    queryKey for an /api endpoint. Such a key joins to the right URL but is
        #    invisible to array-prefix invalidateQueries — the #297 stale-panel bug
        #    class. Not anchored to `queryKey:`, so hoisting the template into a
        #    `const` no longer evades it.
        #
        # 2. query-key-reachability.cjs (WIRING) — fails when an /api invalidation
        #    matches NO fetch key, or when a fetch key sits in a subtree its own
        #    file invalidates yet is spelled so the invalidation misses it.
        #    partialMatchKey compares arrays ELEMENT BY ELEMENT: ["/api/x"] does
        #    NOT match ["/api/x/y"]. Seven dead invalidations shipped before this
        #    existed, the worst leaving Task Operations' queue stale after every
        #    status change.
        #
        # Green as landed; build keys from the factories in
        # client/src/lib/queryClient.ts. (Job `name:` above deliberately unchanged
        # — verbatim required-check string; see the rename warning.)
        run: pnpm guard:querykeys
      - name: Production build
        # The gate used to prove only that the code TYPECHECKS. `tsc --noEmit` never
        # runs vite or esbuild, so a broken import, a failing vite plugin, or a
        # client-library bump that only explodes at bundle time reached `main` green
        # and the deploy died on the platform — where a failed build is invisible,
        # because the last good deployment keeps serving (#268/#278/#277 sat
        # unshipped with the site up and every check green; the same shape recurred
        # on Railway 2026-08-06, nine consecutive failed deploys, nothing alerting).
        #
        # This is the SAME command Railway runs (`railway.json` buildCommand ->
        # `pnpm build`), so it catches our build breaking before merge. It cannot
        # prove the DEPLOY succeeded — platform-side failure after a good build is
        # a different signal, owned by the `verify-deploy` job.
        #
        # Runs BEFORE the boot step below so a database failure there can never
        # mask a broken bundle. (Job `name:` above deliberately unchanged —
        # verbatim required-check string; see the rename warning.)
        run: pnpm build
      - name: Client bundle-size ratchet
        # Measures the ARTIFACT the step above just produced, so it must stay after
        # it — the guard fails loudly rather than skipping if dist/public is absent,
        # because a size guard that passes with nothing to measure is the one state
        # it cannot judge (CHARTER.md §10, "a guard only answers its own question").
        #
        # Gates the EAGER ENTRY GRAPH only — the entry chunk plus its modulepreloads,
        # i.e. what a first-time visitor downloads before anything renders. Lazy route
        # chunks are reported but never gated, so adding a page cannot fail CI; that
        # would train everyone to bump the baseline reflexively and kill the ratchet.
        #
        # Gates RAW bytes, not gzip. The first version gated gzip and went red here on
        # an unchanged bundle: Vite's content hashes churn between builds (fixed-width,
        # so sizes hold but byte sequences shift, changing compressibility), and zlib
        # differs between Node 22 and the 24.x this job runs. Raw is invariant under
        # both. gzip is printed for humans and gated on by nothing.
        #
        # Complements tests/clientSchemaImports.test.ts rather than repeating it: that
        # test forbids ONE source-level cause (a value import of the @shared/schema
        # barrel, which shipped 174 table definitions to every visitor in #482); this
        # counts bytes, so it also catches a fat dependency, a de-lazied route, or a
        # barrel from any other module. #482 records that removing every client value
        # import was not enough on its own. (Job `name:` above deliberately unchanged
        # — verbatim required-check string; see the rename warning.)
        run: pnpm guard:bundle
      - name: Self-host artifact boots (Railway migration path)
        # Build success ≠ boot success (the 2026-07-17 postmortem rule, aimed at
        # the persistent-host bundle Railway actually runs). The `Production
        # build` step above produced dist/index.js; this step applies the
        # migration journal to the disposable Postgres service, boots it with
        # NODE_ENV=production, and requires /api/health to answer 200 — proving
        # bundle + boot wiring (encryption init, seeds, routes, static mount) +
        # DB reachability end to end. Catches the import-time death class
        # (e.g. require(esm)) that a green build hides.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/selfhost_boot
        run: |
          pnpm db:migrate
          # Throwaway high-entropy secrets: production boot validation refuses
          # short ones (SESSION_SECRET >= 32 chars — fail-closed by design).
          NODE_ENV=production PORT=3999 \
          SESSION_SECRET="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          PII_HASH_SALT="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          CREDIT_ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')" \
          node dist/index.js > /tmp/selfhost.log 2>&1 &
          BOOT_PID=$!
          CODE=000
          for i in $(seq 1 45); do
            CODE="$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3999/api/health 2>/dev/null || true)"
            CODE="${CODE:-000}"
            [ "$CODE" = "200" ] && break
            kill -0 "$BOOT_PID" 2>/dev/null || break
            sleep 1
          done
          kill "$BOOT_PID" 2>/dev/null || true
          echo "self-host boot answered HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "--- server log ---"
            cat /tmp/selfhost.log
            echo "::error::dist/index.js failed to boot and serve /api/health — the self-host bundle is broken"
            exit 1
          fi
      - name: Integration lane (HTTP tests against the built bundle)
        # The lane that existed and never protected a PR. `gate` ran node +
        # client only, so tests/mismoExportAccess.test.ts — the role gate on the
        # route that embeds full SSN and DOB — was covered EXCLUSIVELY by a lane
        # nothing ran. 18 files, 148 tests, ~8 seconds against the disposable
        # Postgres this job already provisions.
        #
        # Why a SECOND server rather than reusing the one above: the step above
        # boots NODE_ENV=production deliberately, and that is the posture the
        # suite cannot authenticate against — /api/test-login hard-404s in
        # production (server/auth.ts:62) and the CSRF guard requires an Origin
        # that only some of these files send. Booting a second instance from the
        # SAME dist bundle at NODE_ENV=development gets the suite a login without
        # weakening the production-mode boot proof above, which stays untouched.
        # Consequence to know: this lane therefore does NOT exercise
        # production-mode CSRF or CSP. The files that already send Origin would
        # pass in either posture; making the rest send it is what would let this
        # run in production mode.
        #
        # `seedLendingGrids.ts` runs FIRST and is invoked by path on purpose: it
        # populates FANNIE_LLPA and the policy scalars, nothing in package.json
        # or the seed path calls it, and without it a freshly-provisioned
        # database has ZERO pricing matrices — best-execution rate sync fails at
        # seed time on any new environment. Found by wiring this lane up.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/selfhost_boot
          DEV_TEST_PASSWORD: ci-integration-not-a-secret
          RATE_LIMIT_RELAXED: "true"
          TEST_BASE_URL: http://localhost:4000
        run: |
          ./node_modules/.bin/tsx server/scripts/seedLendingGrids.ts
          pnpm db:seed
          NODE_ENV=development PORT=4000 \
          SESSION_SECRET="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          PII_HASH_SALT="$(node -e 'console.log(require("crypto").randomBytes(48).toString("base64"))')" \
          CREDIT_ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')" \
          node dist/index.js > /tmp/integration-server.log 2>&1 &
          INT_PID=$!
          CODE=000
          for i in $(seq 1 45); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/health 2>/dev/null || true)"
            CODE="${CODE:-000}"
            [ "$CODE" = "200" ] && break
            kill -0 "$INT_PID" 2>/dev/null || break
            sleep 1
          done
          if [ "$CODE" != "200" ]; then
            echo "--- integration server log ---"; cat /tmp/integration-server.log
            kill "$INT_PID" 2>/dev/null || true
            echo "::error::the integration server never became healthy"
            exit 1
          fi
          # Each run gets a fresh process, which matters: the auth limiter is an
          # in-memory store and a second pass in the same 15-minute window 429s
          # (observed while building this step). One pass per boot.
          set +e
          pnpm test:integration
          RESULT=$?
          set -e
          kill "$INT_PID" 2>/dev/null || true
          if [ "$RESULT" != "0" ]; then
            echo "--- integration server log (tail) ---"; tail -60 /tmp/integration-server.log
          fi
          exit "$RESULT"

  migrate-prod:
    name: migrate-prod (apply pending migrations)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Never run two migrations against prod at once; don't cancel one in flight.
    concurrency:
      group: migrate-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Migration ledger pre-flight
        # Last line of defence, and the only ledger check that ever sees `main` itself:
        # the `gate` job is `if: pull_request`, so nothing validates the ledger on the
        # push that actually triggers an apply. Runs before the migrator so a malformed
        # journal (duplicate idx, missing/un-journalled .sql, filename ≠ idx) aborts the
        # job with prod untouched, instead of being applied in an undefined order.
        # Cheap and offline — reads only the repo's own files, no DB connection.
        run: pnpm guard:migrations
      - name: Apply pending migrations to prod
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # Only needed when the API key can see more than one Neon project.
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          # The connection string is piped straight into migrate-prod's env via
          # command substitution: never echoed, never written to GITHUB_ENV, and
          # neither script ever prints it.
          DATABASE_URL="$(node scripts/neon-connection-uri.cjs)" node scripts/migrate-prod.cjs $ARGS

  # ---------------------------------------------------------------------------
  # The gap that let production sit eight commits stale with every check green.
  #
  # On 2026-08-06 nine consecutive Railway deploys failed in the Setup step
  # (`engines.node: "24.x"` is npm range syntax, which mise cannot resolve). A
  # failed Railway deploy does NOT take the site down — it leaves the PREVIOUS
  # container serving. So `gate` was green, `migrate-prod` was green,
  # /api/health answered 200, and nothing anywhere said "the code you merged is
  # not running". It was found by hand, hours later, and only because it had
  # started masking a second fault.
  #
  # This job closes that: after every push to main it asks production which
  # commit it is actually serving, and fails loudly if that is not this one.
  #
  # Deliberately NOT a step inside `gate` (that job is `if: pull_request`, so it
  # never runs on the push that deploys), and deliberately NOT added to branch
  # protection's required contexts — it runs AFTER the merge, so requiring it
  # would deadlock every PR.
  # ---------------------------------------------------------------------------
  verify-deploy:
    name: verify-deploy (prod is serving this commit)
    if: github.event_name == 'push'
    # 🚨 MUST NOT BLOCK THE WORKFLOW. This job and Railway's "Wait for CI"
    # setting are mutually recursive: Wait for CI holds the deploy until every
    # GitHub workflow for the commit succeeds, while this job waits for that
    # same deploy to reach production. Each waits for the other, this job times
    # out after 20 minutes, the workflow fails, and Railway marks the
    # deployment SKIPPED — which is TERMINAL, with no retry. Every subsequent
    # merge repeats it, so the result is a permanent, silent deploy freeze.
    #
    # Observed live on 2026-08-06: deployments b80afca2 (#425) and ed553cf8
    # (#428) both sat in WAITING behind this job minutes after it first merged.
    #
    # `continue-on-error` breaks the cycle without giving up the signal: the job
    # still turns red and still names the stuck commit, but the WORKFLOW
    # concludes success, so Wait for CI releases the deploy. The hard alarm is
    # Railway's own deployment notifications; this is the in-repo tripwire.
    continue-on-error: true
    # Ordered after the migrator so a schema failure is reported as itself
    # rather than as a mysterious stale deployment.
    needs: migrate-prod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Poll /api/health until it reports this commit
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          # Railway builds + boots in ~90s; 60 x 20s = 20 min of headroom for a
          # queued build. `curl -f` keeps a 5xx from being parsed as a payload.
          for i in $(seq 1 60); do
            got="$(curl -sf --max-time 10 https://www.homiquity.com/api/health \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' \
                   2>/dev/null || true)"
            if [ "$got" = "$EXPECTED" ]; then
              echo "prod is serving $EXPECTED"
              exit 0
            fi
            echo "attempt $i/60 — serving '${got:-<none>}', want '$EXPECTED'"
            sleep 20
          done
          echo "::error::prod is NOT serving $EXPECTED after 20 minutes. The merge did not ship."
          echo "Check Railway → project Homiquity → service Homiquity → Deployments for a FAILED build."
          echo "A failed deploy leaves the previous one serving, so the site being UP is not evidence it shipped."
          exit 1
