# CI gate: typecheck, unit tests, production build, lockfile parity.
#
# Runs on every PR and every push to main. Today a red run on main does NOT
# block the Vercel deploy (the documented flow is push-to-main → deploy; see
# CICD.md). When ready to make this a hard gate, enable branch protection on
# main requiring the "ci" check — note that also blocks direct pushes, so the
# `npm run save` flow would move to PRs.
#
# Install mirrors production exactly (pnpm --frozen-lockfile --prod=false,
# same as vercel.json) so CI failures reflect what the deploy would do.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm from package.json packageManager)
        run: corepack enable

      - name: Install (same command as Vercel)
        run: pnpm install --frozen-lockfile --prod=false

      - name: Lockfile parity (pnpm-lock.yaml must mirror package-lock.json)
        # The repo deliberately keeps both lockfiles: npm locally, pnpm on
        # Vercel, synced via `pnpm import` (see kb/app-guide/10-deploy-ops.md).
        # Regenerate and fail if someone changed a dependency without syncing.
        run: |
          pnpm import
          git diff --exit-code pnpm-lock.yaml || {
            echo "::error::pnpm-lock.yaml is out of sync with package-lock.json. Run 'npx pnpm@10 import' and commit both lockfiles."
            exit 1
          }

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
